# Plan A -- class unlearning of CIFAR-10 "ship" (label 8).
#
# The second class. frog (6) was first because its class structure rises
# monotonically with depth and it was the only class with four layer groups above
# SNR 10. ship is the natural second: it has the HIGHEST median channel SNR of
# any class (16.09 against frog's 13.08) and the most channels above the noise
# floor (91.22% against 91.11%), so if the operators can exploit class structure
# at all, this is where it should be easiest. A result here that looks nothing
# like frog's would mean the frog result was about frog, not about the method.
#
# Every search setting below is DELIBERATELY IDENTICAL to plan_a_frog.yaml. They
# are duplicated rather than inherited on purpose: each class's config is meant
# to be a self-contained record of what produced that class's result, and a
# shared base would let an edit made for one class silently change another.
# If you change a number here, change it there too, or the two are not
# comparable.

_base_:
  - base.yaml
  - data/cifar10_class.yaml
  - model/resnet18.yaml

# The data config defaults to frog. Overridden here -- deep_merge replaces these
# two keys and leaves the rest of the data config alone.
split:
  forget_class: 8
  split_file: results/splits/cifar10_class8_ship.json

evaluation:
  # The model being unlearned FROM: trained on all 50 000 images. The SAME W_0
  # as the frog run -- there is one original model and every class is unlearned
  # from it.
  checkpoint: results/checkpoints/cifar10_resnet18_seed42_best.pt

  # The target: trained on D_r only, never saw a ship. Trained on Kaggle
  # (Tesla T4, torch 2.10.0+cu128) with the same recipe as the frog reference,
  # imported from reference_outputs_trial_ship.zip after passing
  # kaggle/reference_training/validate_reference_zip.py.
  #
  # MUST be the _best_dr file, selected on D_r_test accuracy with D_r_test loss
  # as tie-breaker. Measured: D_f_test 0.0000, D_r_test 0.9502, epoch 181.
  reference_checkpoint: results/checkpoints/class8_ship_reference_best_dr.pt

  # --- objectives (fixed; there is no mode flag) ------------------------
  #   f1 = JS(P_ref(D_f) || P(D_f))    match the reference's distribution
  #   f2 = L_r                          retain loss
  #   f3 = ||dtheta|| / ||theta_0||     edit cost

  max_level: 2
  selection_rule: class_contrast

  forget_subset_size: 64
  retain_subset_size: 256

  measure_retain_test: false
  batch_size_key: train
  batch_cap: 3
  num_workers: 0

  compute_mia: true

search:
  name: plan_a_ship
  algorithm: nsga2

  population_size: 10
  generations: 50
  seed: 42

  crossover_probability: 0.9
  mutation_probability: 0.10
  p_active: 0.5

  normalise_objectives: true
  cache_objectives: true
  checkpoint_every_generation: true

  results_dir: results/search/plan_a_ship
